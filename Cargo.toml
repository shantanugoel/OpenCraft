[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/shantanugoel/OpenCraft"

[workspace.dependencies]
opencraft-core = { path = "crates/core" }
hidapi = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2"
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
