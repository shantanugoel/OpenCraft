[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/shantanugoel/OpenCraft"

[workspace.dependencies]
opencraft-core = { path = "crates/core" }
opencraft-engine = { path = "crates/engine" }
hidapi = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
