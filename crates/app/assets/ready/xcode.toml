# Xcode: run, test, stop, and the navigators.
# A ready profile (issue #340). It links to one application.
# It uses built-in icons and no image file.
schema_version = 5
name = "Xcode"
model = "n4-pro"
color = "#6454AC"

[[applications]]
bundle_id = "com.apple.dt.Xcode"
name = "Xcode"

[[pages]]
name = "Run"

[pages.surfaces.key-face-1]
