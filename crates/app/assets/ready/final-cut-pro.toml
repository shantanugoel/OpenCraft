# Final Cut Pro: play, edit, and clip volume.
# A ready profile (issue #340). It links to one application.
# It uses built-in icons and no image file.
schema_version = 5
name = "Final Cut Pro"
model = "n4-pro"
color = "#B83F4C"

[[applications]]
bundle_id = "com.apple.FinalCut"
name = "Final Cut Pro"

[[pages]]
name = "Play"

