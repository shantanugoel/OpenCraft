# Everyday Mac: applications, web pages, sleep, and a page change.
# A starter profile of the first start (decision 0029, section 18).
# It uses only standard macOS applications and system actions, and no
# image file. The test `each_starter_profile_loads_and_is_valid` checks it.
schema_version = 4
name = "Everyday Mac"
model = "n4-pro"
color = "#3B82F6"

[[pages]]
name = "Apps"

[pages.surfaces.key-face-1]
label = "Finder"
color = "#356AB6"
label_size = 18
label_color = "#FFFFFF"
icon = "folder"
icon_color = "#FFFFFF"

[pages.surfaces.key-face-2]
label = "Safari"
color = "#298886"
label_size = 18
label_color = "#FFFFFF"
icon = "compass"
icon_color = "#FFFFFF"

[pages.surfaces.key-face-3]
label = "Mail"
color = "#6454AC"
label_size = 18
label_color = "#FFFFFF"
icon = "mail"
icon_color = "#FFFFFF"

[pages.surfaces.key-face-4]
label = "Calendar"
color = "#B83F4C"
label_size = 18
label_color = "#FFFFFF"
icon = "calendar"
icon_color = "#FFFFFF"

[pages.surfaces.key-face-5]
label = "Notes"
color = "#C4A53E"
label_size = 18
icon = "sticky-note"

[pages.surfaces.key-face-6]
label = "Messages"
color = "#3D875A"
label_size = 18
label_color = "#FFFFFF"
icon = "message-circle"
icon_color = "#FFFFFF"

[pages.surfaces.key-face-7]
label = "Music"
color = "#B65C86"
label_size = 18
label_color = "#FFFFFF"
icon = "music"
icon_color = "#FFFFFF"

[pages.surfaces.key-face-8]
label = "Photos"
color = "#CC7135"
