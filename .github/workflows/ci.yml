name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # hidapi and GPUI need native headers. No WebView is used.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev pkg-config clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libvulkan1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  # Decision 0026: the licences of the dependencies, and the notices file.
  licences:
    name: Licences and notices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Fails for a licence that is not in deny.toml, and for a crate that
      # does not come from crates.io. The target of deny.toml is the macOS
      # build.
      - name: Licences and sources of the dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources
          arguments: --locked

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      # Fails when THIRD-PARTY-NOTICES.txt is not correct for Cargo.lock and
      # about.toml. cargo-about reads the crates of all platforms.
      - name: Notices file
        run: |
          cargo fetch --locked
          scripts/notices.sh --check
